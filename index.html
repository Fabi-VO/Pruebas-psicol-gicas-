<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Test de Prueba</title>
</head>
<body>
  <h1>Test de 2 Preguntas</h1>
  <form id="quiz-form">
    <div id="questions-container"></div>
    <button type="submit">Enviar</button>
  </form>
  <div id="results"></div>

  <script>
    const preguntas = [
      { id: 1, text: "¿El cielo es azul?" },
      { id: 2, text: "¿El agua moja?" }
    ];

    const container = document.getElementById('questions-container');
    container.innerHTML = preguntas.map(p => `
      <div>
        <p>${p.id}. ${p.text}</p>
        <label><input type="radio" name="p${p.id}" value="si"> Sí</label>
        <label><input type="radio" name="p${p.id}" value="no"> No</label>
      </div>
    `).join('');

    document.getElementById('quiz-form').onsubmit = function(e) {
      e.preventDefault();
      const results = document.getElementById('results');
      results.innerHTML = '<p>¡Formulario enviado!</p>';
    };
  </script>
</body>
</html>
